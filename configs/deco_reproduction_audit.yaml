paper:
  title: "DeCo: Task Decomposition and Skill Composition for Zero-Shot Generalization in Long-Horizon 3D Manipulation"
  arxiv: "2505.00527"
  versions_read: ["v1", "v2"]
  version_note: "核心数字一致；v2 补充 GPU 型号(8x RTX 4090)；两版表格编号不同；逐句 diff 未做 -> PARTIAL"
  components:
    - id: A
      name: "Physical Interaction-based Task Decomposition and Skill Learning"
      section: "III-B"
      key_points: ["p_full / p_half 两种粒度", "keyframe discovery [43]", "原子指令库 L^a", "goal pose = full interaction 末帧", "50 demos/任务"]
    - id: B
      name: "VLM-Guided Planning and Skill Scheduling"
      section: "III-C"
      key_points: ["GPT-4o", "输入: 指令 + RGB + 原子指令库", "goal-pose 位姿闭环判断技能完成"]
    - id: C
      name: "Spatially-Aware Skill Chaining"
      section: "III-D"
      key_points: ["当前 goal pose + 预测的下一 start pose + 场景点云", "cost map 改编自 VoxPoser", "生成 collision-free chaining poses", "明确不用常规全局运动规划器"]
  protocol:
    benchmark: DeCoBench
    source_tasks: 4
    atomic_skills: 10
    compositional_tasks: 12
    demos_per_atomic: 50
    test_demos_per_composition: 20
    seeds: 3
    residuals: "20 x 3 的组织方式未说明 -> UNVERIFIED"
    hardware: "8 x RTX 4090 (v2)"
    batch: {rvt2: 24, arp: 48, 3dda: 8}
    cameras: 4
    resolution: {rvt2: 128, arp: 128, 3dda: 256}
    goal_pose_frame: robot_base
    metrics: {atomic: success_rate, compositional: success_rate, ordered_sr_equivalent: false}
  table_ii: {rvt2_deco: 66.67, 3dda_deco: 21.53, arp_deco: 58.06}
  ablation: {chaining_poses_num_zero: "性能显著下降 (V-D)"}

